[package]
name = "cm-engine-camoufox"
description = "Camoufox implementation of cm_core::Engine (process management, pinned machine, python helper)"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
cm-core.workspace = true
anyhow.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
rusqlite.workspace = true
zip = { version = "2.6.1", default-features = false, features = ["deflate"] }
sysinfo = { version = "0.37", default-features = false, features = ["system"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security"] }
