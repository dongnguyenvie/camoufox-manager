[package]
name = "cm-relay"
description = "Local fail-closed proxy relay (browser -> 127.0.0.1 -> upstream) and proxy checker"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
cm-core.workspace = true
anyhow.workspace = true
async-trait.workspace = true
base64.workspace = true
reqwest.workspace = true
serde_json.workspace = true
tokio.workspace = true
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "aws-lc-rs"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["tls12", "aws-lc-rs"] }
webpki-roots = "1"
